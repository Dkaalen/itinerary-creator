<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f141a;
      --panel: #161c22;
      --panel-soft: #202832;
      --paper: #f4efe8;
      --ink: #1f3446;
      --body: #2f2f2f;
      --muted: #756e66;
      --accent: #2f756f;
      --border: rgba(148, 163, 184, 0.25);
      --focus: #e8b656;
      --danger: #ad3434;
      --page-w: 794px;
      --page-h: 1123px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: #e8edf2;
      font-family: Arial, Helvetica, sans-serif;
    }
    .editor-shell { padding: 18px 14px 34px; }
    .editor-toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(22, 28, 34, 0.96);
      backdrop-filter: blur(8px);
    }
    .toolbar-copy strong { display: block; font-size: 15px; letter-spacing: -0.01em; }
    .toolbar-copy span { display: block; margin-top: 3px; color: #a9b6c2; font-size: 12px; }
    .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    button, select, input[type="text"] {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #202832;
      color: #eef4f7;
      min-height: 34px;
      padding: 7px 10px;
      font-weight: 700;
      font-size: 12px;
    }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: rgba(255,255,255,0.14); color: white; }
    button.ghost { background: transparent; }
    button.danger { background: rgba(173,52,52,0.16); border-color: rgba(173,52,52,0.45); color: #ffd9d9; }
    button:hover, select:hover { filter: brightness(1.08); }
    .page-stack { display: flex; flex-direction: column; gap: 32px; align-items: center; }
    .page-wrap { width: min(var(--page-w), calc(100vw - 34px)); }
    .page-label {
      color: #a9b6c2;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 0 0 8px 2px;
    }
    .a4-page {
      position: relative;
      width: var(--page-w);
      min-height: var(--page-h);
      background: var(--paper);
      color: var(--body);
      box-shadow: 0 20px 55px rgba(0,0,0,0.33);
      overflow: hidden;
      transform-origin: top center;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .page-content { padding: 88px 88px 46px; position: relative; z-index: 2; }
    .cover-page { position: relative; display: block; background-size: cover; background-position: center center; background-repeat: no-repeat; }
    .cover-page .page-content { position: absolute; inset: 0; min-height: var(--page-h); box-sizing: border-box; padding: 0; display: block; }
    .cover-emblem { width: 52px; height: 52px; border: 1px solid rgba(184,149,85,.72); border-radius: 50%; margin: 0 auto 15px auto; position: relative; }
    .cover-emblem::before { content: "✦"; position: absolute; left: 0; right: 0; top: 13px; text-align: center; font-size: 18px; color: var(--cover-accent, #b89555); }
    .cover-main { position: absolute; top: 70px; left: 0; right: 0; transform: none; width: auto; max-width: none; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .cover-destination-card { margin: 20px auto 0 auto; padding-top: 0; max-width: 610px; }
    .cover-destination-label { font-family: Arial, Helvetica, sans-serif; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--cover-accent, #b89555); font-weight: 800; margin-bottom: 10px; }
    .cover-kicker, .city, .section-title, .row-type {
      font-family: Arial, Helvetica, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
      font-weight: 800;
      color: var(--cover-muted, var(--muted));
    }
    .cover-title {
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--cover-ink, var(--ink));
      font-size: 47px;
      line-height: 1.04;
      font-weight: 700;
      margin: 16px 0 14px;
    }
    .cover-subtitle {
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--cover-ink, var(--ink));
      display: block;
      width: 610px;
      max-width: calc(100% - 144px);
      box-sizing: border-box;
      font-size: 21px;
      line-height: 1.28;
      margin: 0 auto;
      text-align: center;
      text-wrap: balance;
    }
    .cover-rule { width: 160px; height: 1px; background: var(--cover-accent, #b89555); opacity: .55; margin: 24px auto 0 auto; position: relative; }
    .cover-rule::after { content: ""; width: 7px; height: 7px; background: var(--cover-accent, #b89555); position: absolute; left: 50%; top: -3px; transform: translateX(-50%) rotate(45deg); }
    .cover-destinations { color: var(--cover-ink, var(--body)); font-size: 14px; line-height: 1.45; text-transform: uppercase; letter-spacing: .08em; }
    .summary-page { background-size: cover, cover; background-position: center center, center center; background-repeat: no-repeat, no-repeat; }
    .summary-card { border: 1px solid rgba(31,52,70,.16); background: rgba(255,255,255,.76); padding: 24px; margin-bottom: 28px; box-shadow: 0 10px 26px rgba(31,52,70,.06); }
    .summary-title { font-family: Georgia, 'Times New Roman', serif; color: var(--ink); font-size: 28px; margin-bottom: 14px; }
    .glance-row { display: grid; grid-template-columns: 150px 1fr; gap: 16px; padding: 8px 0; border-bottom: 1px solid rgba(31,52,70,.12); font-size: 14px; line-height: 1.45; }
    .glance-label { font-weight: 800; color: var(--ink); }
    .journey-table { width: 100%; border-collapse: collapse; color: var(--body); font-size: 14px; line-height: 1.4; }
    .journey-table th { text-align: left; color: var(--ink); padding: 8px 6px; border-bottom: 1px solid rgba(31,52,70,.18); }
    .journey-table td { padding: 9px 6px; border-bottom: 1px solid rgba(31,52,70,.12); vertical-align: top; }
    .day-kicker { font-family: Arial, Helvetica, sans-serif; font-size: 11px; line-height: 1.25; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 800; margin-bottom: 14px; }
    .day-kicker-symbol { color: var(--cover-accent, #b89555); letter-spacing: .10em; margin: 0 8px; }
    .day-kicker-city { display: inline; font-family: Arial, Helvetica, sans-serif; font-size: 11px; line-height: 1.25; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
    .day-label { font-family: Georgia, 'Times New Roman', serif; font-size: 34px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
    .day-title { font-family: Georgia, 'Times New Roman', serif; font-size: 27px; line-height: 1.15; font-weight: 500; color: var(--ink); margin-bottom: 20px; }
    .city { margin-bottom: 20px; }
    .intro { font-family: Georgia, 'Times New Roman', serif; font-size: 15px; line-height: 1.5; margin-bottom: 22px; color: var(--body); }
    .day-blocks { position: relative; }
    .content-block { margin-bottom: 15px; position: relative; }
    .section-title, .row-type { color: var(--accent); margin-bottom: 5px; font-size: 11px; }
    .small-section { margin-top: 8px; }
    .body-text, .editable-list, .detail-list, .final-list { font-family: Georgia, 'Times New Roman', serif; font-size: 13.5px; line-height: 1.38; margin-bottom: 5px; }
    .strong-line { font-weight: 700; }
    .meta-line { font-family: Georgia, 'Times New Roman', serif; font-size: 13.5px; line-height: 1.38; margin-bottom: 4px; }
    .meta-label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 800; color: var(--ink); }
    ul.detail-list, ul.final-list { margin: 0 0 6px 0; padding-left: 18px; }
    .inclusion-entry { margin: 0 0 11px 0; }
    .inclusion-entry-title { margin-bottom: 2px; }
    .inclusion-entry-detail { color: var(--muted); margin-bottom: 0; display: block; }
    .inclusion-entry-spacer { height: 8px; line-height: 8px; }
    li { margin: 0 0 2px 0; }
    [contenteditable="true"] { outline: 0; border-radius: 4px; min-height: 1em; transition: background .12s, box-shadow .12s; }
    [contenteditable="true"]:hover { background: rgba(232, 182, 86, 0.16); box-shadow: 0 0 0 1px rgba(232,182,86,0.24); }
    [contenteditable="true"]:focus { background: rgba(255, 246, 213, 0.94); box-shadow: 0 0 0 2px var(--focus); }
    .editable-inline { padding: 1px 2px; margin-left: -2px; }
    .cover-main .editable-inline { margin-left: 0 !important; padding-left: 0 !important; padding-right: 0 !important; text-align: center !important; align-self: center !important; }
    .cover-main .cover-title, .cover-main .cover-subtitle, .cover-main .cover-destinations, .cover-main .cover-kicker { margin-left: auto !important; margin-right: auto !important; text-align: center !important; }
    .day-blocks[contenteditable="true"] { padding: 2px; margin: -2px; }
    .image-stage {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      bottom: 0;
      top: 610px;
      background: rgba(0,0,0,0.04);
      border-top: 5px solid rgba(184,149,85,.96);
      box-shadow: none;
      overflow: visible;
    }
    .image-stage::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 26px;
      background: linear-gradient(to bottom, rgba(244,239,232,.16), rgba(244,239,232,0));
      z-index: 2;
      pointer-events: none;
    }
    .image-stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-stage.empty { display: flex; align-items: center; justify-content: center; color: #6b625a; font-weight: 700; }
    .image-stage.skipped { display: none; }
    .image-actions {
      position: absolute;
      z-index: 5;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px;
      border-radius: 14px;
      background: rgba(15, 20, 26, 0.86);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
    }
    .image-stage:hover .image-actions, .image-actions:focus-within { display: flex; }
    .image-actions select, .image-actions button, .image-actions input { min-height: 30px; font-size: 11px; padding: 5px 8px; }
    .upload-label { display: inline-flex; align-items: center; min-height: 30px; padding: 5px 8px; border-radius: 10px; border: 1px solid var(--border); color: white; background: #202832; font-weight: 700; font-size: 11px; cursor: pointer; }
    .upload-label input { display: none; }
    .final-page .page-content { padding-top: 86px; }
    .final-title { font-family: Georgia, 'Times New Roman', serif; color: var(--ink); font-size: 26px; line-height: 1.18; margin-bottom: 10px; }
    .final-title::after {
      content: "";
      display: block;
      width: 86px;
      height: 1px;
      background: rgba(31,52,70,.20);
      margin-top: 12px;
    }
    .final-edit-box, .final-html-box {
      width: 100%; min-height: 720px; border: 1px dashed rgba(31,52,70,.20); background: rgba(255,255,255,.16); color: var(--body); font-family: Georgia, 'Times New Roman', serif; font-size: 14px; line-height: 1.45; padding: 10px; border-radius: 8px; white-space: pre-wrap;
    }
    .final-html-box { white-space: normal; }
    .saved-note { color: #bfe7d9; font-weight: 700; font-size: 12px; display: none; }
    .saved-note.show { display: inline; }
    .help-strip { margin-top: 10px; color: #a9b6c2; font-size: 12px; line-height: 1.4; text-align: center; }
    @media (max-width: 860px) {
      .a4-page { transform: scale(calc((100vw - 34px) / 794)); margin-bottom: calc(-1123px + ((100vw - 34px) / 794 * 1123px)); }
      .editor-toolbar { align-items: flex-start; flex-direction: column; }
      .toolbar-actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
<script>
const Streamlit = {
  setComponentReady: function() {
    window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:componentReady', apiVersion: 1}, '*');
  },
  setFrameHeight: function(height) {
    window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:setFrameHeight', height: height}, '*');
  },
  setComponentValue: function(value) {
    window.parent.postMessage({isStreamlitMessage: true, type: 'streamlit:setComponentValue', value: value}, '*');
  }
};
let initialPayload = null;
let model = null;
let uploadedImages = {};
function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
}
function escAttr(s) {
  return esc(s).replace(/'/g, '&#39;');
}
function focusPos(focus) {
  if (focus === 'bottom') return 'center 78%';
  if (focus === 'center') return 'center center';
  return 'center 22%';
}
function editableText(value, key, cls='') {
  return `<div class="${cls} editable-inline" contenteditable="true" data-edit-key="${esc(key)}">${esc(value)}</div>`;
}
function editableSpan(value, key, cls='') {
  return `<span class="${cls} editable-inline" contenteditable="true" data-edit-key="${esc(key)}">${esc(value)}</span>`;
}
function editableHtml(value, key, cls='') {
  return `<div class="${cls}" contenteditable="true" data-edit-key="${esc(key)}">${value || ''}</div>`;
}
function imageHtml(day, dayIndex) {
  const img = day.image || {};
  const options = img.options || [];
  const optionHtml = options.map((opt, idx) => `<option value="${esc(opt.path)}" data-option-index="${idx}" title="${esc(opt.reason || '')}" ${opt.path === img.path ? 'selected' : ''}>${esc(opt.name)}</option>`).join('');
  const hasImage = !!img.data_uri;
  const src = hasImage ? `<img src="${esc(img.data_uri)}" style="object-position:${focusPos(img.crop_focus)}" alt="${esc(img.name || '')}">` : `<span>${img.pending_preview ? 'Replacement selected — save to update preview' : 'No picture selected'}</span>`;
  return `<div class="image-stage ${hasImage ? '' : 'empty'}" data-day-index="${dayIndex}">
      ${src}
      <div class="image-actions">
        <button type="button" data-img-action="auto" data-day-index="${dayIndex}">Automatic</button>
        <button type="button" class="danger" data-img-action="none" data-day-index="${dayIndex}">Remove</button>
        <select data-img-focus="${dayIndex}">
          <option value="top" ${img.crop_focus === 'top' ? 'selected' : ''}>Sky / upper crop</option>
          <option value="center" ${img.crop_focus === 'center' ? 'selected' : ''}>Center crop</option>
          <option value="bottom" ${img.crop_focus === 'bottom' ? 'selected' : ''}>Lower crop</option>
        </select>
        <select data-img-bank="${dayIndex}"><option value="">Choose replacement…</option>${optionHtml}</select>
        <button type="button" data-img-action="manual" data-day-index="${dayIndex}">Use selected</button>
        <label class="upload-label">Upload<input type="file" accept="image/png,image/jpeg,image/webp" data-img-upload="${dayIndex}"></label>
      </div>
    </div>`;
}
function summaryPage(summary) {
  const glance = summary?.trip_glance || {};
  const arc = summary?.journey_arc || [];
  const glanceRows = Object.keys(glance).map(key => `<div class="glance-row"><div class="glance-label">${esc(key)}</div>${editableText(glance[key], `summary.trip_glance.${key}`, 'glance-value')}</div>`).join('');
  const arcRows = arc.map((row, idx) => `<tr><td>${editableText(row.chapter, `summary.journey_arc.${idx}.chapter`, '')}</td><td>${editableText(row.days, `summary.journey_arc.${idx}.days`, '')}</td><td>${editableText(row.experience, `summary.journey_arc.${idx}.experience`, '')}</td></tr>`).join('');
  const bg = model.cover?.cover_background_data_uri || '';
  const summaryStyle = bg ? `background-image: linear-gradient(rgba(244,239,232,.40), rgba(244,239,232,.40)), url('${escAttr(bg)}');` : '';
  return `<div class="page-wrap"><div class="page-label">Summary page</div><div class="a4-page summary-page" style="${summaryStyle}"><div class="page-content">
    <div class="summary-card"><div class="summary-title">Your Trip at a Glance</div>${glanceRows}</div>
    <div class="summary-card"><div class="summary-title">Your Journey Arc</div><table class="journey-table"><thead><tr><th>Chapter</th><th>Days</th><th>What You’ll Experience</th></tr></thead><tbody>${arcRows}</tbody></table></div>
  </div></div></div>`;
}
function finalTextPage(label, title, key, text) {
  return `<div class="page-wrap"><div class="page-label">${esc(label)}</div><div class="a4-page final-page"><div class="page-content">
    <div class="final-title">${esc(title)}</div>
    ${editableText(text || '', `final_pages.${key}`, 'final-edit-box')}
  </div></div></div>`;
}
function finalHtmlPage(label, title, key, html) {
  return `<div class="page-wrap"><div class="page-label">${esc(label)}</div><div class="a4-page final-page"><div class="page-content">
    <div class="final-title">${esc(title)}</div>
    ${editableHtml(html || '', `final_pages.${key}`, 'final-html-box')}
  </div></div></div>`;
}
function render(payload) {
  initialPayload = JSON.parse(JSON.stringify(payload || {cover:{},summary:{},days:[],final_pages:{}}));
  model = JSON.parse(JSON.stringify(initialPayload));
  uploadedImages = {};
  draw();
}
function draw() {
  const root = document.getElementById('root');
  let h = `<div class="editor-shell">
    <div class="editor-toolbar">
      <div class="toolbar-copy"><strong>Edit directly on the proposal pages</strong><span>Click text on the A4 pages and type. Hover a day image for picture tools. Save before reviewing/exporting.</span></div>
      <div class="toolbar-actions"><span id="savedNote" class="saved-note">Saved to app</span><button class="ghost" id="resetBtn" type="button">Reset unsaved changes</button><button class="primary" id="saveBtn" type="button">Save edits to preview/PDF</button></div>
    </div>
    <div class="page-stack">`;
  const coverStyle = `background-image: url('${escAttr(model.cover?.cover_background_data_uri || '')}'); --cover-ink: ${escAttr(model.cover?.cover_ink || '#1f3446')}; --cover-muted: ${escAttr(model.cover?.cover_muted || '#7b746c')}; --cover-accent: ${escAttr(model.cover?.cover_accent || '#b89555')};`;
  h += `<div class="page-wrap"><div class="page-label">Cover page</div><div class="a4-page cover-page" style="${coverStyle}"><div class="page-content">
      <div class="cover-main">
        <div class="cover-emblem" aria-hidden="true"></div>
        ${editableText(model.cover?.cover_kicker || 'Travel Itinerary', 'cover.cover_kicker', 'cover-kicker')}
        ${editableText(model.cover?.trip_title, 'cover.trip_title', 'cover-title')}
        ${editableText(model.cover?.trip_subtitle, 'cover.trip_subtitle', 'cover-subtitle')}
        <div class="cover-rule"></div>
        <div class="cover-destination-card">
          <div class="cover-destination-label">Route</div>
          ${editableHtml(model.cover?.destinations_line_html || esc(model.cover?.destinations_line), 'cover.destinations_line', 'cover-destinations')}
        </div>
      </div>
    </div></div></div>`;
  h += summaryPage(model.summary || {});
  (model.days || []).forEach((day, i) => {
    const dayNumber = String(day.day || '').replace(/^Day\s*/i, '').trim() || String(i + 1);
    h += `<div class="page-wrap"><div class="page-label">${esc(day.day)}</div><div class="a4-page day-page"><div class="page-content">
      <div class="day-kicker">DAY ${esc(dayNumber)} <span class="day-kicker-symbol">✦</span> ${editableSpan(day.city, `days.${i}.city`, 'day-kicker-city')}</div>
      ${editableText(day.title, `days.${i}.title`, 'day-title')}
      ${editableText(day.intro, `days.${i}.intro`, 'intro')}
      ${editableHtml(day.blocks_html || '', `days.${i}.blocks_html`, 'day-blocks')}
    </div>${imageHtml(day, i)}</div></div>`;
  });
  h += finalHtmlPage('Included', "What's included", 'whats_included_html', model.final_pages?.whats_included_html || model.final_pages?.whats_included_text || '');
  h += finalTextPage('Excluded', "What's not included", 'whats_not_included_text', model.final_pages?.whats_not_included_text || '');
  h += finalTextPage('Notes', 'Important travel notes', 'important_travel_notes_text', model.final_pages?.important_travel_notes_text || '');
  h += `</div><div class="help-strip">The PDF preview/export remains the final rendering check after saving your edits.</div></div>`;
  root.innerHTML = h;
  attachHandlers();
  requestAnimationFrame(() => { adjustDayImages(); Streamlit.setFrameHeight(document.body.scrollHeight + 20); });
}
function setByPath(obj, path, value) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const part = parts[i];
    const nextPart = parts[i+1];
    if (Array.isArray(cur)) cur = cur[Number(part)];
    else cur = cur[part] ?? (cur[part] = /^\d+$/.test(nextPart) ? [] : {});
  }
  const last = parts[parts.length - 1];
  if (Array.isArray(cur)) cur[Number(last)] = value;
  else cur[last] = value;
}
function collect() {
  document.querySelectorAll('[data-edit-key]').forEach(el => {
    const key = el.getAttribute('data-edit-key');
    const value = key.endsWith('.blocks_html') ? el.innerHTML.trim() : el.innerText.replace(/\u00a0/g, ' ').trim();
    setByPath(model, key, value);
  });
  Object.keys(uploadedImages).forEach(idx => {
    if (model.days[idx]) model.days[idx].image.upload = uploadedImages[idx];
  });
  return model;
}
function adjustDayImages() {
  const pageHeight = 1123;
  const minImageHeight = 185;
  document.querySelectorAll('.day-page').forEach(page => {
    const content = page.querySelector('.page-content');
    const stage = page.querySelector('.image-stage');
    if (!content || !stage || stage.classList.contains('empty')) return;
    const contentBottom = content.offsetTop + content.scrollHeight;
    const imageTop = Math.max(contentBottom + 20, (pageHeight / 2) + 20);
    const imageHeight = pageHeight - imageTop;
    if (imageHeight < minImageHeight) {
      stage.classList.add('skipped');
      return;
    }
    stage.classList.remove('skipped');
    stage.style.top = `${imageTop}px`;
    stage.style.height = `${imageHeight}px`;
  });
}

function pruneForSave(value) {
  const copy = JSON.parse(JSON.stringify(value || {}));
  (copy.days || []).forEach(day => {
    if (!day.image) return;
    delete day.image.data_uri;
    delete day.image.auto_data_uri;
    delete day.image.options;
    // Keep upload data only for real uploads. Existing preview images should
    // never be posted back to Streamlit just because the user edited text.
    if (day.image.upload && !day.image.upload.data_uri) delete day.image.upload;
  });
  return copy;
}

function attachHandlers() {
  document.getElementById('saveBtn').addEventListener('click', () => {
    const data = collect();
    Streamlit.setComponentValue(JSON.stringify(pruneForSave(data)));
    const note = document.getElementById('savedNote');
    note.classList.add('show');
    setTimeout(() => note.classList.remove('show'), 1500);
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    model = JSON.parse(JSON.stringify(initialPayload));
    uploadedImages = {};
    draw();
  });
  document.querySelectorAll('[contenteditable="true"]').forEach(el => {
    el.addEventListener('input', () => requestAnimationFrame(adjustDayImages));
  });
  document.querySelectorAll('[data-img-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      collect();
      const idx = Number(btn.getAttribute('data-day-index'));
      const action = btn.getAttribute('data-img-action');
      const day = model.days[idx];
      if (!day || !day.image) return;
      if (action === 'auto') {
        day.image.mode = 'auto';
        day.image.path = '';
        day.image.data_uri = day.image.auto_data_uri || day.image.data_uri || '';
        day.image.name = day.image.auto_name || day.image.name || '';
      }
      if (action === 'none') {
        day.image.mode = 'none';
        day.image.path = '';
        day.image.data_uri = '';
        day.image.name = '';
      }
      if (action === 'manual') {
        const sel = document.querySelector(`[data-img-bank="${idx}"]`);
        if (sel && sel.value) {
          const selected = (day.image.options || []).find(opt => opt.path === sel.value) || {};
          day.image.mode = 'manual';
          day.image.path = sel.value;
          day.image.data_uri = '';
          day.image.name = selected.name || sel.options[sel.selectedIndex]?.text || '';
          day.image.pending_preview = true;
        }
      }
      draw();
    });
  });
  document.querySelectorAll('[data-img-focus]').forEach(sel => {
    sel.addEventListener('change', () => {
      const idx = Number(sel.getAttribute('data-img-focus'));
      if (model.days[idx] && model.days[idx].image) model.days[idx].image.crop_focus = sel.value;
      const img = sel.closest('.image-stage')?.querySelector('img');
      if (img) img.style.objectPosition = focusPos(sel.value);
    });
  });
  document.querySelectorAll('[data-img-upload]').forEach(input => {
    input.addEventListener('change', () => {
      const idx = Number(input.getAttribute('data-img-upload'));
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        uploadedImages[idx] = {filename: file.name, data_uri: reader.result, season: 'Summer', label: file.name.replace(/\.[^.]+$/, '')};
        if (model.days[idx] && model.days[idx].image) {
          model.days[idx].image.mode = 'manual';
          model.days[idx].image.path = '';
          model.days[idx].image.data_uri = reader.result;
        }
        const stage = input.closest('.image-stage');
        if (stage) {
          stage.classList.remove('empty');
          const existing = stage.querySelector('img');
          if (existing) existing.src = reader.result;
          else stage.insertAdjacentHTML('afterbegin', `<img src="${reader.result}" style="object-position:${focusPos(model.days[idx].image.crop_focus)}" alt="Uploaded picture">`);
          requestAnimationFrame(adjustDayImages);
        }
      };
      reader.readAsDataURL(file);
    });
  });
}
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'streamlit:render') {
    render(event.data.args.payload);
  }
});
Streamlit.setComponentReady();
Streamlit.setFrameHeight(1200);
</script>
</body>
