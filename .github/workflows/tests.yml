name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Import smoke
        run: python scripts/import_smoke.py

      - name: Architecture guards
        run: python scripts/architecture_guards.py

      - name: Calculator and artifact regression tests
        run: >-
          python -m pytest
          tests/test_calculator_*.py
          tests/test_patch_ak_cleanup_hygiene.py
          tests/test_ci_workflow_guards.py
          -q

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Frontend JavaScript syntax
        run: |
          node --check calculator_grid_component/frontend/js/*.js
          node --check visual_editor_component/frontend/js/*.js

      - name: Diff whitespace check
        run: git --no-pager diff --check

      - name: Known legacy Nordic sample check
        continue-on-error: true
        run: python -m pytest tests/test_nordic_quality_sample.py -q
