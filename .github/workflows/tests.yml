name: Tests

on:
  pull_request:
  push:
    branches:
      - main

env:
  PYTHONUNBUFFERED: '1'
  ITINERARY_TEST_STAGE_TIMEOUT_SECONDS: '300'
  ITINERARY_RELEASE_STEP_TIMEOUT_SECONDS: '900'

jobs:
  health-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Import smoke
        run: python scripts/import_smoke.py

      - name: Architecture guards
        run: |
          python scripts/architecture_guards.py
          python -m pytest tests/test_architecture_guard_system.py -q

      - name: Test runner and CI guard tests
        run: >-
          python -m pytest
          tests/test_test_runner_groups.py
          tests/test_ci_workflow_guards.py
          tests/test_pytest_marker_discipline.py
          -q

      - name: Critical product smoke
        run: python scripts/run_test_group.py critical

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Pytest collection
        run: python -m pytest --collect-only -q

      - name: Test-suite audit
        run: python scripts/test_suite_audit.py

      - name: Frontend JavaScript syntax
        run: |
          node --check calculator_grid_component/frontend/js/*.js
          node --check visual_editor_component/frontend/js/*.js

      - name: Diff whitespace check
        run: git --no-pager diff --check

  test-groups:
    runs-on: ubuntu-latest
    needs: health-gates
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group:
          - critical
          - fast
          - calculator
          - storage
          - workflow
          - architecture
          - parser
          - activity
          - editor
          - images
          - ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run ${{ matrix.group }} test group
        run: python scripts/run_test_group.py ${{ matrix.group }}

  quality-group:
    runs-on: ubuntu-latest
    needs: health-gates
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run quality test group
        run: python scripts/run_test_group.py quality

  pdf-group:
    runs-on: ubuntu-latest
    needs: health-gates
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run PDF test group
        run: python scripts/run_test_group.py pdf

  nordic-quality-sample:
    runs-on: ubuntu-latest
    needs: health-gates
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Nordic quality sample
        run: python -m pytest tests/test_nordic_quality_sample.py -q
