[pytest]
pythonpath = .
testpaths = tests
markers =
    critical: instant critical-surface smoke and failure-mode contracts
    fast: small everyday safety gate; excludes PDF, slow, and large quality modules
    parser: parser, date/time, extractor, and normalizer behavior
    activity: activity product rules, catalogues, source fidelity, and QA warnings
    architecture: architecture boundary, ownership, and runner infrastructure checks
    calculator: calculator state, grid, local library, and workbook export behavior
    editor: visual editor, typed draft, autosave, and editor/export state safety
    images: image-bank paths, matching, auditing, destination pictures, and image QA
    storage: project identity, Supabase repository, cloud browser, and save/load behavior
    ui: Streamlit workflow shell, export readiness, image gateway, and UI boundaries
    workflow: hosted app flow, stage transitions, editor/export state, and runtime guardrails
    unit: fast unit-level tests that should be safe for local health checks
    integration: focused integration tests that cross app modules or exercise larger flows
    pdf: tests that render or inspect PDF output
    quality: real-fixture quality gates and broad generated-output checks
    slow: slower end-to-end or file-heavy tests; run intentionally
    calculator-browser: explicit Calculator Chromium workflow and protocol contract stages
    formulas: formula evaluation, financial parity, dependency, and currency behavior
    validation: action-scoped validation and Local Library workbook diagnostics
    workbook: Calculator Excel import, export, template, and package preservation
    calculator-realistic: realistic Calculator use and workflow invariants
    project-management: project identity, switching, duplication, rename, and saves
    rollback: transactional project save and reconstruction rollback
    cloud-lifecycle: cloud open, save, download, delete, and browser lifecycle
    reconstruction: saved-project reconstruction authority and rebuild paths
    generation: Calculator handoff and itinerary-generation transitions
    editor-pictures: editor draft, picture selection, image safety, and autosave integration
    generator: generator, render-artifact, and prepared-document ownership
    routes: Streamlit routes, transport facts, destination routes, and continuity
    inclusions: structured inclusions, exclusions, source identity, and PDF projection
    export: PDF, Excel, readiness, artifact, and export-state contracts
    failure-modes: timeouts, recovery, rollback, diagnostics, and resilient state transitions
addopts = -ra
