[pytest]
pythonpath = .
testpaths = tests
markers =
    fast: small everyday safety gate; excludes PDF, slow, and large quality modules
    parser: parser, date/time, extractor, and normalizer behavior
    activity: activity product rules, catalogues, source fidelity, and QA warnings
    architecture: architecture boundary, ownership, and runner infrastructure checks
    calculator: calculator state, grid, local library, and workbook export behavior
    editor: visual editor, typed draft, autosave, and editor/export state safety
    images: image-bank paths, matching, auditing, destination pictures, and image QA
    storage: project identity, Supabase repository, cloud browser, and save/load behavior
    ui: Streamlit workflow shell, export readiness, image gateway, and UI boundaries
    workflow: hosted app flow, stage transitions, editor/export state, and runtime guardrails
    unit: fast unit-level tests that should be safe for local health checks
    integration: focused integration tests that cross app modules or exercise larger flows
    pdf: tests that render or inspect PDF output
    quality: real-fixture quality gates and broad generated-output checks
    slow: slower end-to-end or file-heavy tests; run intentionally
addopts = -ra
